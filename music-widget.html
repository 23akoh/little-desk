<aside id="music-dock" class="music-dock" aria-label="Your soundtrack">
  <button id="music-toggle" class="music-toggle" aria-expanded="false" aria-controls="music-panel"><span aria-hidden="true">♫</span> <span id="music-toggle-label">A little soundtrack</span><span class="sound-dot" aria-hidden="true"></span></button>
  <section id="music-panel" class="music-panel" hidden><div class="music-heading"><div><span class="eyebrow">SOUND ON YOUR TERMS</span><h2>A little soundtrack.</h2></div><button id="music-collapse" class="icon-button" aria-label="Collapse music player">−</button></div>
    <div class="music-tabs" role="group" aria-label="Music source"><button data-music-tab="ambient" aria-pressed="true">Our little sounds</button><button data-music-tab="spotify" aria-pressed="false">My Spotify</button></div>
    <div id="ambient-panel"><div class="sound-grid" role="group" aria-label="Choose a background sound"><button data-sound="keys" aria-pressed="false"><span>♬</span>Soft keys<small>original little lofi loop</small></button><button data-sound="rain" aria-pressed="false"><span>☂</span>Window rain<small>a little patter</small></button><button data-sound="forest" aria-pressed="false"><span>♧</span>Forest air<small>leaves & distant birds</small></button><button data-sound="brown" aria-pressed="false"><span>≈</span>Brown noise<small>soft, steady hush</small></button></div><div class="ambient-bottom"><button id="sound-stop" class="subtle-button">Pause sound</button><label>Volume <input id="ambient-volume" type="range" min="0" max="60" value="15" aria-label="Ambient sound volume"></label></div><p class="music-status" id="music-status" role="status">Choose a sound when you’re ready. Nothing plays automatically.</p></div>
    <div id="spotify-panel" hidden><form id="spotify-form"><label for="spotify-link">Bring your playlist, album or song.</label><div><input id="spotify-link" type="url" placeholder="https://open.spotify.com/playlist/…" required><button class="primary" type="submit">Load ▷</button></div></form><iframe id="spotify-player" title="Your Spotify music player" width="100%" height="152" hidden style="border:0;border-radius:12px" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe><p class="spotify-note">Play and sign in through Spotify’s player. Little Desk does not read your private library.</p><a class="spotify-open" href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">Open my Spotify ↗</a><p class="music-status" id="spotify-status" role="status"></p></div>
  </section>
</aside>
